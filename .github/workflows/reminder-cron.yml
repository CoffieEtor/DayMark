# Triggers the Vercel function that sends due reminders. GitHub's scheduler is best-effort
# (every ~5 min, can lag), which is fine for the free Vercel plan. On Vercel Pro you can use
# a Vercel Cron job instead and delete this file.
name: Send due reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets not set; skipping."; exit 0; fi
          curl -fsS --retry 2 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
