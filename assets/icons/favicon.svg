<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#232731" />
      <stop offset="100%" stop-color="#101114" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E2B8" />
      <stop offset="50%" stop-color="#D6B56D" />
      <stop offset="100%" stop-color="#9E8040" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Outer Emblem Ring -->
  <circle cx="256" cy="256" r="176" fill="#17191E" stroke="rgba(214,181,109,0.3)" stroke-width="3" filter="url(#subtleShadow)"/>

  <!-- Geometric DAYMARK 'D' Monogram with Sunburst Tick -->
  <g transform="translate(160, 140)">
    <!-- Vertical stem -->
    <rect x="0" y="0" width="36" height="232" rx="18" fill="url(#goldGradient)" />
    <!-- Loop of D -->
    <path d="M 28 0 H 100 C 165 0 204 46 204 116 C 204 186 165 232 100 232 H 28" 
          fill="none" stroke="url(#goldGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sun pip / Daymark star -->
    <circle cx="168" cy="48" r="16" fill="#FFFFFF" opacity="0.9" filter="url(#subtleShadow)" />
    <circle cx="168" cy="48" r="8" fill="#D6B56D" />
  </g>
</svg>
